<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090a0b">
  <meta name="description" content="Yuli Studio - E-commerce visual design portfolio">
  <title>Yuli Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 01. Opening logo: change the displayed name here. -->
  <main class="launch" id="launch" aria-label="Yuli Studio">
    <!-- 02. Honeycomb metal field: visual-only background layers. -->
    <div class="metal-field" aria-hidden="true">
      <canvas class="metal-field__canvas" id="metal-canvas"></canvas>
    </div>

    <!-- 03. Ghost cursor layer: the pointer path is rendered into metal-canvas. -->
    <div class="ghost-layer" id="ghost-layer" aria-hidden="true"></div>

    <div class="launch__logo" aria-label="Yuli Studio">
      <span class="launch__word" aria-hidden="true">
        <span>Y</span><span>U</span><span>L</span><span>I</span>
      </span>
      <span class="launch__studio">Studio</span>
    </div>

    <!-- 04. Keep this interface minimal. It appears after the opening completes. -->
    <div class="launch__meta launch__meta--left">ECOMMERCE VISUAL DESIGN / 2026</div>
    <div class="launch__meta launch__meta--right"><span></span> YULI STUDIO</div>
    <button class="launch__skip" id="launch-skip" type="button">SKIP INTRO</button>
    <button class="launch__enter" id="work-enter" type="button"><span>VIEW SELECTED WORK</span><b>↘</b></button>
  </main>

  <section class="work-screen" id="work" aria-labelledby="work-title">
    <div class="work-screen__topline">
      <span>02 / SELECTED WORK</span>
      <span>YE Y.L. / VISUAL DESIGNER</span>
    </div>
    <header class="work-header">
      <div>
        <p class="work-kicker">YULI STUDIO / E-COMMERCE VISUAL SYSTEMS</p>
        <h1 id="work-title">作品集<span class="work-header__dot">.</span></h1>
      </div>
      <div class="work-intro">
        <p>跨境与国内电商视觉设计<br>从产品叙事到转化触点。</p>
        <a href="assets/portfolio/resume.pdf" download>下载简历 <span>↗</span></a>
      </div>
    </header>

    <div class="work-toolbar" aria-label="作品筛选">
      <div class="work-filters" role="tablist">
        <button class="work-filter is-active" type="button" data-filter="all" role="tab" aria-selected="true">全部 <span>11</span></button>
        <button class="work-filter" type="button" data-filter="banner" role="tab" aria-selected="false">Banner <span>04</span></button>
        <button class="work-filter" type="button" data-filter="campaign" role="tab" aria-selected="false">Campaign <span>03</span></button>
        <button class="work-filter" type="button" data-filter="detail" role="tab" aria-selected="false">详情 / A+ <span>02</span></button>
        <button class="work-filter" type="button" data-filter="system" role="tab" aria-selected="false">视觉系统 <span>02</span></button>
      </div>
      <p class="work-toolbar__hint"><span class="work-toolbar__line"></span> HOVER TO EXPLORE / CLICK TO OPEN</p>
    </div>

    <div class="work-grid" id="work-grid">
      <article class="work-card work-card--wide" data-category="banner" data-title="独立站网页 Banner" data-type="Banner / 视觉主KV" data-description="以产品质感和空间感为核心，构建独立站首页的首屏节奏与转化入口。" data-image="assets/portfolio/banner-main.jpg">
        <button class="work-card__button" type="button" aria-label="打开独立站网页 Banner 项目">
          <span class="work-card__media"><img src="assets/portfolio/banner-main.jpg" alt="独立站网页 Banner 作品" loading="lazy"><span class="work-card__sheen"></span></span>
          <span class="work-card__meta"><span><i>01</i> / BANNER</span><strong>独立站网页 Banner</strong><em>VIEW PROJECT ↗</em></span>
        </button>
      </article>
      <article class="work-card" data-category="campaign" data-title="情人节独立站活动页" data-type="Campaign / Landing Page" data-description="围绕节日礼赠场景组织产品、优惠和情绪画面，完成活动页的完整视觉叙事。" data-image="assets/portfolio/banner-valentine.jpg">
        <button class="work-card__button" type="button" aria-label="打开情人节独立站活动页项目">
          <span class="work-card__media"><img src="assets/portfolio/banner-valentine.jpg" alt="情人节独立站活动页作品" loading="lazy"><span class="work-card__sheen"></span></span>
          <span class="work-card__meta"><span><i>02</i> / CAMPAIGN</span><strong>情人节独立站活动页</strong><em>VIEW PROJECT ↗</em></span>
        </button>
      </article>
      <article class="work-card" data-category="banner" data-title="产品系列 Banner / 01" data-type="Banner / Product Direction" data-description="产品系列的主视觉延展，统一构图、材质与信息层级，适配站内多个触点。" data-image="assets/portfolio/banner-frame-2527.jpg">
        <button class="work-card__button" type="button" aria-label="打开产品系列 Banner 项目">
          <span class="work-card__media"><img src="assets/portfolio/banner-frame-2527.jpg" alt="产品系列 Banner 作品" loading="lazy"><span class="work-card__sheen"></span></span>
          <span class="work-card__meta"><span><i>03</i> / BANNER</span><strong>产品系列 Banner / 01</strong><em>VIEW PROJECT ↗</em></span>
        </button>
      </article>
      <article class="work-card work-card--tall" data-category="campaign" data-title="Battle 68 活动海报" data-type="Campaign / Poster" data-description="电竞产品促销海报，使用强对比节奏强化核心卖点、限时信息与行动按钮。" data-image="assets/portfolio/poster-battle68.jpg">
        <button class="work-card__button" type="button" aria-label="打开 Battle 68 活动海报项目">
          <span class="work-card__media"><img src="assets/portfolio/poster-battle68.jpg" alt="Battle 68 活动海报作品" loading="lazy"><span class="work-card__sheen"></span></span>
          <span class="work-card__meta"><span><i>04</i> / CAMPAIGN</span><strong>Battle 68 活动海报</strong><em>VIEW PROJECT ↗</em></span>
        </button>
      </article>
      <article class="work-card work-card--wide" data-category="system" data-title="亚马逊店铺视觉优化" data-type="System / Amazon Storefront" data-description="从店铺首页到品牌模块重构视觉层级，建立可复用的电商品牌表达。" data-image="assets/portfolio/visual-amazon.jpg">
        <button class="work-card__button" type="button" aria-label="打开亚马逊店铺视觉优化项目">
          <span class="work-card__media"><img src="assets/portfolio/visual-amazon.jpg" alt="亚马逊店铺视觉优化作品" loading="lazy"><span class="work-card__sheen"></span></span>
          <span class="work-card__meta"><span><i>05</i> / SYSTEM</span><strong>亚马逊店铺视觉优化</strong><em>VIEW PROJECT ↗</em></span>
        </button>
      </article>
      <article class="work-card" data-category="detail" data-title="磁吸充电宝详情页" data-type="Detail / Domestic E-commerce" data-description="以结构化卖点拆解、场景图与功能动线完成国内平台详情页设计。" data-image="assets/portfolio/detail-cn-powerbank.jpg">
        <button class="work-card__button" type="button" aria-label="打开磁吸充电宝详情页项目">
          <span class="work-card__media"><img src="assets/portfolio/detail-cn-powerbank.jpg" alt="磁吸充电宝详情页作品" loading="lazy"><span class="work-card__sheen"></span></span>
          <span class="work-card__meta"><span><i>06</i> / DETAIL</span><strong>磁吸充电宝详情页</strong><em>VIEW PROJECT ↗</em></span>
        </button>
      </article>
      <article class="work-card" data-category="detail" data-title="跨境产品详情 / 4154" data-type="Detail / Cross-border" data-description="跨境平台产品详情页，兼顾信息密度、阅读节奏与多语言适配空间。" data-image="assets/portfolio/detail-crossborder.jpg">
        <button class="work-card__button" type="button" aria-label="打开跨境产品详情项目">
          <span class="work-card__media"><img src="assets/portfolio/detail-crossborder.jpg" alt="跨境产品详情作品" loading="lazy"><span class="work-card__sheen"></span></span>
          <span class="work-card__meta"><span><i>07</i> / DETAIL</span><strong>跨境产品详情 / 4154</strong><em>VIEW PROJECT ↗</em></span>
        </button>
      </article>
      <article class="work-card work-card--wide" data-category="system" data-title="独立站网页视觉优化" data-type="System / DTC Storefront" data-description="梳理独立站首页、导航、产品模块和活动入口，形成统一的 DTC 视觉系统。" data-image="assets/portfolio/visual-storefront.jpg">
        <button class="work-card__button" type="button" aria-label="打开独立站网页视觉优化项目">
          <span class="work-card__media"><img src="assets/portfolio/visual-storefront.jpg" alt="独立站网页视觉优化作品" loading="lazy"><span class="work-card__sheen"></span></span>
          <span class="work-card__meta"><span><i>08</i> / SYSTEM</span><strong>独立站网页视觉优化</strong><em>VIEW PROJECT ↗</em></span>
        </button>
      </article>
      <article class="work-card" data-category="banner" data-title="产品系列 Banner / 02" data-type="Banner / Product Direction" data-description="延续产品系列的画面语言，使用更克制的构图承接办公场景与产品功能。" data-image="assets/portfolio/banner-frame-2529.jpg">
        <button class="work-card__button" type="button" aria-label="打开产品系列 Banner 02 项目">
          <span class="work-card__media"><img src="assets/portfolio/banner-frame-2529.jpg" alt="产品系列 Banner 02 作品" loading="lazy"><span class="work-card__sheen"></span></span>
          <span class="work-card__meta"><span><i>09</i> / BANNER</span><strong>产品系列 Banner / 02</strong><em>VIEW PROJECT ↗</em></span>
        </button>
      </article>
      <article class="work-card" data-category="banner" data-title="产品系列 Banner / 03" data-type="Banner / Product Direction" data-description="以材质光影和克制的版式建立产品高级感，适配站内横幅与社媒传播。" data-image="assets/portfolio/banner-frame-2531.jpg">
        <button class="work-card__button" type="button" aria-label="打开产品系列 Banner 03 项目">
          <span class="work-card__media"><img src="assets/portfolio/banner-frame-2531.jpg" alt="产品系列 Banner 03 作品" loading="lazy"><span class="work-card__sheen"></span></span>
          <span class="work-card__meta"><span><i>10</i> / BANNER</span><strong>产品系列 Banner / 03</strong><em>VIEW PROJECT ↗</em></span>
        </button>
      </article>
      <article class="work-card work-card--tall" data-category="campaign" data-title="S9 产品海报" data-type="Campaign / Poster" data-description="以电竞氛围和硬件细节为主线，建立适合促销传播的高冲击海报画面。" data-image="assets/portfolio/poster-s9.jpg">
        <button class="work-card__button" type="button" aria-label="打开 S9 产品海报项目">
          <span class="work-card__media"><img src="assets/portfolio/poster-s9.jpg" alt="S9 产品海报作品" loading="lazy"><span class="work-card__sheen"></span></span>
          <span class="work-card__meta"><span><i>11</i> / CAMPAIGN</span><strong>S9 产品海报</strong><em>VIEW PROJECT ↗</em></span>
        </button>
      </article>
    </div>

    <footer class="work-footer">
      <span>YULI STUDIO / SELECTED WORKS</span>
      <span>SCROLL TO CONTINUE <b>↓</b></span>
    </footer>
  </section>

  <div class="project-modal" id="project-modal" aria-hidden="true">
    <button class="project-modal__backdrop" type="button" data-modal-close aria-label="关闭项目详情"></button>
    <aside class="project-modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="project-modal__close" type="button" data-modal-close aria-label="关闭">×</button>
      <div class="project-modal__image"><img id="modal-image" src="" alt=""></div>
      <div class="project-modal__copy">
        <p id="modal-type"></p>
        <h2 id="modal-title"></h2>
        <p id="modal-description"></p>
        <span class="project-modal__index" id="modal-index"></span>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
  <script src="work.js"></script>
</body>
</html>
